name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo registry and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify tag matches Cargo.toml version
        id: version_check
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_REF#v}"
          echo "Tag: $TAG_REF (parsed: $TAG_VERSION)"

          # Extract version from Cargo.toml
          CARGO_VERSION=$(grep '^version =' Cargo.toml | cut -d'"' -f2)

          echo "Cargo version: $CARGO_VERSION"

          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Failed to parse version from Cargo.toml"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Missing CARGO_REGISTRY_TOKEN secret"
            exit 1
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

      - name: Check if release already exists
        id: rel_exists
        run: |
          set -euo pipefail
          TAG="v${{ steps.version_check.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate formatted changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"

          # Find the previous tag before the just-pushed tag commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || true)

          if [ -z "${PREV_TAG}" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Prepare temp files per section
          TMPDIR=$(mktemp -d)
          declare -A SECTION_FILES
          declare -A SECTION_TITLES

          add_section() {
            local key="$1" title="$2"
            SECTION_TITLES["$key"]="$title"
            SECTION_FILES["$key"]="$TMPDIR/$key.txt"
            : > "${SECTION_FILES[$key]}"
          }

          add_section feat   "New Features"
          add_section fix    "Bug Fixes"
          add_section perf   "Performance"
          add_section revert "Reverts"
          add_section docs   "Documentation"
          add_section breaking "Breaking Changes"

          include_docs_commit() {
            local hash="$1"
            # Check if commit touches documentation files
            git diff-tree --no-commit-id --name-only -r "$hash" | \
              grep -Eq '\.(md|rst|txt|adoc)$|^docs/|^documentation/|README|CHANGELOG|CONTRIBUTING|LICENSE'
          }

          # Iterate commits with NUL-separated records and field separator 0x1f
          git log -z --no-merges --format='%H%x1f%s%x1f%b%x00' ${RANGE} |
          while IFS= read -r -d '' rec; do
            IFS=$'\x1f' read -r hash subject body <<< "$rec"

            # Extract header to infer type and breaking
            header=${subject%%:*}
            rest=${subject#*: }

            # Infer breaking via '!' in header or markers in body
            breaking_hint=""
            case "$header" in
              *!*) breaking_hint=1 ;;
            esac
            if [ -z "$breaking_hint" ] && printf '%s' "$body" | grep -qiE '^breaking change|^breaking:'; then
              breaking_hint=1
            fi

            # Normalize type: strip optional scope and trailing '!'
            base=${header%%(*}
            base=${base%%!*}
            lower_type=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')

            line="- ${subject}"

            case "$lower_type" in
              feat)
                printf '%s\n' "$line" >> "${SECTION_FILES[feat]}" ;;
              fix)
                printf '%s\n' "$line" >> "${SECTION_FILES[fix]}" ;;
              perf)
                printf '%s\n' "$line" >> "${SECTION_FILES[perf]}" ;;
              revert)
                printf '%s\n' "$line" >> "${SECTION_FILES[revert]}" ;;
              docs)
                if include_docs_commit "$hash"; then
                  printf '%s\n' "$line" >> "${SECTION_FILES[docs]}"
                fi ;;
              *)
                # Skip chores, ci, tests, refactors, build, style by default
                : ;;
            esac

            if [ -n "$breaking_hint" ]; then
              printf '%s\n' "$line" >> "${SECTION_FILES[breaking]}"
            fi
          done

          DATE_UTC=$(date -u +%Y-%m-%d)

          {
            printf '# Changelog %s (%s)\n\n' "$CURRENT_TAG" "$DATE_UTC"
            if [ -n "${PREV_TAG}" ]; then
              printf 'Compare %s...%s (https://github.com/%s/compare/%s...%s)\n\n' \
                     "$PREV_TAG" "$CURRENT_TAG" "$GITHUB_REPOSITORY" "$PREV_TAG" "$CURRENT_TAG"
              commit_count=$(git rev-list --count "$PREV_TAG"..HEAD)
            else
              commit_count=$(git rev-list --count HEAD)
            fi
            printf 'This release includes %d commits.\n\n' "$commit_count"
          } > changelog.md

          emit_section() {
            local key="$1"
            local title="${SECTION_TITLES[$key]}"
            local file="${SECTION_FILES[$key]}"
            if [ -s "$file" ]; then
              printf '## %s\n\n' "$title" >> changelog.md
              cat "$file" >> changelog.md
              printf '\n' >> changelog.md
            fi
          }

          # Emit sections in user-centric order
          emit_section breaking
          emit_section feat
          emit_section fix
          emit_section perf
          emit_section docs
          emit_section revert

          if [ ! -s changelog.md ] || ! grep -q '^## ' changelog.md; then
            printf 'This release does not include user-visible changes.\n' >> changelog.md
          fi

      - name: Create GitHub Release
        if: steps.rel_exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: ${{ github.event.pull_request != null }}
          name: v${{ steps.version_check.outputs.version }}
          body_path: ${{ github.event.pull_request == null && 'changelog.md' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build release binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo registry and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --locked --release

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/release/bole"
          if [ ! -f "$BIN_PATH" ]; then
            echo "::error::Binary not found at $BIN_PATH"
            exit 1
          fi
          OS_LOWER=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          # Normalize architecture names
          case "$ARCH" in
            "x86_64") ARCH="x86_64" ;;
            "aarch64" | "arm64") ARCH="aarch64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          ARCHIVE="dist/bole-${{ github.ref_name }}-${OS_LOWER}-${ARCH}.tar.gz"
          cp "$BIN_PATH" bole
          FILES="bole"
          [ -f "LICENSE" ] && FILES="$FILES LICENSE"
          [ -f "README.md" ] && FILES="$FILES README.md"
          tar -czf "$ARCHIVE" $FILES
          echo "Created $ARCHIVE"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/release/bole.exe"
          if (!(Test-Path $bin)) { throw "Binary not found at $bin" }
          Copy-Item $bin -Destination "bole.exe"
          $os = "windows"
          # Normalize Windows architecture to match Unix naming
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
            "AMD64" { "x86_64" }
            "ARM64" { "aarch64" }
            default { throw "Unsupported architecture: $env:PROCESSOR_ARCHITECTURE" }
          }
          $archive = "dist/bole-${{ github.ref_name }}-$os-$arch.zip"
          $files = @("bole.exe")
          if (Test-Path "LICENSE") { $files += "LICENSE" }
          if (Test-Path "README.md") { $files += "README.md" }
          Compress-Archive -Path $files -DestinationPath $archive
          Write-Output "Created $archive"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.os }}
          path: dist/*

  attach-assets:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crate, build-binaries]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
